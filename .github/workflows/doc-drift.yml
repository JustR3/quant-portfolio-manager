name: doc-drift

# Monthly sweep that checks every command shown in README.md/docs still runs, and fixes stale
# YAML front-matter headers. Opens a PR if anything changed and merges it after the in-job checks
# pass; opens an issue if the run fails.
# Auth: CLAUDE_CODE_OAUTH_TOKEN (generated via `claude setup-token`), so runs draw from the
# Claude subscription instead of separate API billing — same as self-harden.yml.
#
# No `pull_request` trigger: GitHub requires manual approval for any workflow run triggered by
# a pull_request whose author is github-actions[bot] (github.blog/changelog/2026-06-11). Since
# this job's own auto-fix PR is opened by that bot via the default GITHUB_TOKEN, a pull_request
# trigger here would get stuck as `action_required` on every run of its own PR and never
# actually execute — the exact bug hit and fixed in the sibling "Dynamic DCA" repo's
# doc-drift.yml (see its own file for the PR reference). self-harden.yml never had this problem
# because it was never given a pull_request trigger in the first place — this file matches that
# same pattern.
#
# Monthly (1st, ~06:00 UTC), matching self-harden.yml's cadence family (1st of month) — offset
# one hour so the two jobs don't start at the exact same minute. This repo is PARKED (README
# "Status: PARKED" / this file's own CLAUDE.md "Direction: PARKED") — deliberately low-frequency,
# not actively developed. This is a markdown/docs hygiene check only: it does not run backtests,
# optimization, or any live/refresh cycle, and does not touch data/historical/, data/research/,
# or data/backtests/.
on:
  schedule:
    - cron: "0 6 1 * *" # 1st of the month, ~06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write # opens an issue when a run fails
  id-token: write # required by anthropics/claude-code-action's own OIDC token exchange

concurrency:
  group: doc-drift
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install (locked)
        run: uv sync --frozen

      - name: Run doc-drift check
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Check every command shown in README.md and docs/ actually runs (this repo is run via
            `uv run ./main.py ...` — there is no installed `qpm` binary; see CLAUDE.md).
            Fix stale YAML front-matter headers. Never touch a pre-registered threshold, gate,
            spec, or the five-negatives verdicts in the README. Never run anything that writes to
            data/historical/, data/research/, or data/backtests/. Summarize what you changed and
            why, or state plainly that you found nothing.
          claude_args: '--allowedTools "Read,Edit,Bash"'

      - name: Discard changes outside the allowed paths
        # The tree verified below must be exactly the tree the PR merges, so
        # out-of-scope changes (for example data files rewritten by running a
        # documented command) are discarded here, with a warning, before the
        # checks run.
        run: |
          while IFS= read -r f; do
            case "$f" in
              README.md|docs/*|*.md) ;;
              *)
                echo "::warning::discarding change outside the allowed paths: $f"
                if git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                  git restore --source=HEAD --staged --worktree -- "$f"
                else
                  rm -rf -- "$f"
                fi
                ;;
            esac
          done < <(git status --porcelain --untracked-files=all | cut -c4-)

      - name: Verify tests and lint pass
        run: |
          uv run pytest -q
          uv run ruff check .
          uv run ruff format --check .

      - name: Open PR if anything changed
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(doc-drift): fix stale docs and examples"
          title: "doc-drift: automated doc/example fixes"
          branch: doc-drift/auto-fix
          base: main
          delete-branch: true
          add-paths: |
            README.md
            docs/**
            *.md

      - name: Merge PR
        # GitHub holds pull_request runs on bot-created PRs for manual approval
        # (changelog 2026-06-11), so the PR's own `test` check never starts on
        # its own. This job already ran the same tests and lint on the exact
        # tree the PR contains, so it merges the PR itself. --match-head-commit
        # refuses the merge if the branch moved after the checks ran.
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --merge --delete-branch \
            --match-head-commit "${{ steps.cpr.outputs.pull-request-head-sha }}"

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="doc-drift run failed"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "@$OWNER failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "@$OWNER the doc-drift workflow failed and nothing was merged. Run: $RUN_URL"
          fi
