name: test

# Runs the test suite and lint on every push and pull request. Previously
# neither ran anywhere except inside self-harden.yml's weekly schedule, so a
# bad commit to main (or an open PR) had no automated check until Wednesday.
# This workflow only reports status — it does not commit or open PRs.

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install (locked)
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Run lint
        run: uv run ruff check .
